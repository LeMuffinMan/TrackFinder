<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>TrackFinder</title>
  <link data-trunk rel="rust" data-wasm-opt="1" />
  <!-- Trail tiles are generated by `trailprep`, never committed. Copying them in
       on every build is what makes them survive `trunk build`, which wipes dist.
       The directory is committed empty so a fresh clone still builds; the map
       then says it has no trail data instead of failing to compile. -->
  <link data-trunk rel="copy-dir" href="data/trails" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="trackfinder_canvas"></canvas>
</body>
</html>
