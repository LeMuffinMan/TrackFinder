name: GitHub Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rights required by artifact-based Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Bump to pull fresh OSM data. Trail archives are a dated snapshot, and
  # rebuilding them takes several minutes: without this key they would be
  # regenerated on every push for data that has not meaningfully changed.
  DATA_EPOCH: "2026-09"
  # The French Alps, matching the application's opening view.
  ALPS_BBOX: "43.95,5.35,46.45,7.75"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `cargo test` builds the native target, hence winit/glutin: a bare runner
      # lacks those system libraries. The wasm target does not need them.
      - name: System dependencies (native test build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev

      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      # Network tests are #[ignore]: CI depends on neither Overpass nor IGN.
      - name: Tests
        run: |
          cargo test --locked
          cargo test --locked -p trailfmt

      # Informative, never blocking: clippy follows the runner's stable release
      # and gains lints with every version. A new lint must not stop a
      # deployment — the tests, on the other hand, stay blocking.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings

      # A cache key may not contain commas, and the bounding box is full of them.
      # Derived here rather than kept as a second, dash-separated copy of the
      # box: two hand-maintained forms of the same value drift.
      - name: Derive the data cache key
        run: echo "DATA_KEY=${DATA_EPOCH}-${ALPS_BBOX//,/_}" >> "$GITHUB_ENV"

      # The archives are generated, never committed: a regenerated 30 MB blob in
      # git history would be there for good. The key covers the preprocessor's
      # own sources, so changing the format regenerates the data. No
      # `restore-keys`: a partial match would serve data built from a different
      # box or a different format, which is worse than rebuilding.
      - name: Trail archive cache
        id: trails-cache
        uses: actions/cache@v4
        with:
          path: data/trails
          key: trails-${{ env.DATA_KEY }}-${{ hashFiles('trailprep/src/**', 'trailfmt/src/**') }}

      # ~850 MB of extracts in, ~2 GB of RAM, a few minutes of CPU. Measured on
      # 2026-09-04: Rhône-Alpes alone peaked at 1.08 GB and took 219 s.
      - name: Build trail archives
        if: steps.trails-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p data/extracts data/trails
          for region in rhone-alpes provence-alpes-cote-d-azur; do
            echo "downloading $region"
            curl -sSL --retry 3 --retry-delay 5 \
              -o "data/extracts/$region.osm.pbf" \
              "https://download.geofabrik.de/europe/france/$region-latest.osm.pbf"
          done
          # Both extracts in one run, deliberately: a node shared by two ways on
          # either side of the regional boundary is only seen as a junction if
          # both files are counted together.
          cargo run --release --locked -p trailprep -- \
            --name "Alpes françaises" \
            --out data/trails/alps \
            --bbox "$ALPS_BBOX" \
            data/extracts/*.osm.pbf
          rm -rf data/extracts
          echo "$(find data/trails -name '*.tft' | wc -l) tiles"
          du -sh data/trails

      # The site is served from /TrackFinder/: without --public-url the HTML
      # would look for the .wasm at the domain root and show nothing.
      - name: Build
        run: trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"

      # After `trunk build`, which wipes dist. The manifest is assembled from the
      # fragments each preprocessor run writes, so a bounding box is never
      # repeated by hand and can never drift from what was actually built.
      - name: Publish trail tiles
        run: |
          set -euo pipefail
          mkdir -p dist/trails
          # One directory per region, each holding its index and its tiles.
          for region in data/trails/*/; do
            cp -r "$region" dist/trails/
          done
          {
            printf '{"regions":['
            # `cat | paste -sd,` and not `paste -sd, files...`: the latter
            # serialises each file onto its own line instead of joining across
            # them, which is valid JSON only as long as there is exactly one
            # region — it would break the day a second massif is added.
            cat data/trails/*.json | paste -sd,
            printf ']}'
          } > dist/trails/regions.json
          cat dist/trails/regions.json
          echo "$(find dist/trails -name '*.tft' | wc -l) tiles published"
          du -sh dist/trails

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
