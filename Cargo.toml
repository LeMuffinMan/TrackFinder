[package]
name = "trackfinder"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
ehttp = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.9"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
console_log = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Backends de fenêtrage : nécessaires seulement pour lancer en natif (dev/tests).
eframe = { version = "0.36", features = ["x11", "wayland"] }
env_logger = "0.11"

[profile.release]
opt-level = 2
